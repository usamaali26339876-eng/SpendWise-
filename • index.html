<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Personal Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SpendWise</h1>
            <p>Smart Financial Tracking Made Simple</p>
        </header>

        <!-- Dashboard Summary Display Cards -->
        <div class="dashboard">
            <div class="card">
                <h3>Monthly Budget</h3>
                <p id="budget-display">$0.00</p>
            </div>
            <div class="card">
                <h3>Total Expenses</h3>
                <p id="total-expenses-display">$0.00</p>
            </div>
            <div class="card" id="balance-card">
                <h3>Remaining Balance</h3>
                <p id="balance-display">$0.00</p>
                <small id="status-message">Enter a budget to begin</small>
            </div>
        </div>

        <!-- Main Configuration Area -->
        <div class="app-grid">
            <!-- Setup & Input Forms Column -->
            <div class="forms-column">
                <!-- Budget Setting Panel -->
                <div class="panel">
                    <h2>1. Set Monthly Budget</h2>
                    <form id="budget-form">
                        <div class="form-group">
                            <label for="budget-input">Total Budget Amount ($)</label>
                            <input type="number" id="budget-input" placeholder="e.g. 2000" min="1" step="0.01" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Set Budget</button>
                    </form>
                </div>

                <!-- Add Expense Panel -->
                <div class="panel">
                    <h2>2. Add New Expense</h2>
                    <form id="expense-form">
                        <div class="form-group">
                            <label for="expense-name">Expense Name</label>
                            <input type="text" id="expense-name" placeholder="e.g. Groceries" required>
                        </div>
                        <div class="form-group">
                            <label for="expense-amount">Amount ($)</label>
                            <input type="number" id="expense-amount" placeholder="e.g. 45.50" min="0.01" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="expense-category">Category</label>
                            <select id="expense-category" required>
                                <option value="" disabled selected>Select category</option>
                                <option value="Food">Food & Dining</option>
                                <option value="Housing">Housing/Rent</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success">Add Expense</button>
                    </form>
                </div>
            </div>

            <!-- Expense Ledger Log Column -->
            <div class="ledger-column">
                <div class="panel list-panel">
                    <h2>Expense History Ledger</h2>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Description</th>
                                    <th>Category</th>
                                    <th>Amount</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="expense-list">
                                <!-- JavaScript injects dynamic data table rows here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Correctly linking the script file before closing the body -->
    <script src="script.js"></script>
</body>
</html>
